name: Label issues with two approvals

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      label:
        description: Label name to add
        required: true
        default: approved
        type: string
      full_scan:
        description: Rescan every issue instead of only issues updated since the last successful backfill
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: approve-label-${{ github.event.issue.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  approve-label:
    if: github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ inputs.label || vars.APPROVAL_LABEL || 'approved' }}
      FULL_SCAN: ${{ inputs.full_scan || 'false' }}
    steps:
      - uses: actions/github-script@v7
        with:
          # Retry GitHub 5xx responses (for example a 500 with an empty
          # body on issues.listComments) instead of failing the run.
          retries: 3
          script: |
            const REQUIRED_APPROVALS = 2;
            const SAFETY_OVERLAP_MS = 10 * 60 * 1000;
            const { owner, repo } = context.repo;
            const label = process.env.LABEL;
            const forceFullScan =
              String(process.env.FULL_SCAN).toLowerCase() === "true";

            if (!label) {
              core.setFailed("Label name is empty.");
              return;
            }

            function labelsOf(issue) {
              return (issue.labels || []).map((item) =>
                typeof item === "string" ? item : item.name
              );
            }

            function hasLabel(issue, name) {
              const wanted = name.toLowerCase();
              return labelsOf(issue).some(
                (item) => (item || "").toLowerCase() === wanted
              );
            }

            async function labelExists(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function ensureLabelExists() {
              if (await labelExists(label)) return;

              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "0E8A16",
                  description: "Approved by at least two reviewers"
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            async function getApprovers(issueNumber) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100
                }
              );

              const approvers = new Set();

              for (const comment of comments) {
                const login = comment.user?.login?.toLowerCase() || "";
                if (!login || comment.user?.type === "Bot") continue;

                const body = (comment.body || "").trim().toLowerCase();
                if (body === "approve" || body === "approved") {
                  approvers.add(login);
                }
              }

              return approvers;
            }

            async function addLabelIfNeeded(issue, approvers) {
              if (approvers.size < REQUIRED_APPROVALS) {
                return false;
              }

              if (hasLabel(issue, label)) {
                return false;
              }

              await ensureLabelExists();

              // This is additive: category labels such as frontend, CSA,
              // format, and tidy are preserved.
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [label]
              });

              return true;
            }

            async function getLastSuccessfulBackfillStart() {
              const response = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: "approve-label.yml",
                  branch: "main",
                  event: "workflow_dispatch",
                  status: "success",
                  per_page: 100
                }
              );

              const runs = Array.isArray(response)
                ? response
                : response.workflow_runs || [];

              for (const run of runs) {
                if (
                  run.event === "workflow_dispatch" &&
                  run.conclusion === "success"
                ) {
                  return run.created_at;
                }
              }

              return null;
            }

            // Manual run: backfill historical issues.
            if (context.eventName === "workflow_dispatch") {
              const targetLabelExists = await labelExists(label);

              let lastSuccessfulStart = null;
              if (targetLabelExists) {
                try {
                  lastSuccessfulStart =
                    await getLastSuccessfulBackfillStart();
                } catch (error) {
                  core.warning(
                    `Could not read previous backfill state; ` +
                    `falling back to a full scan: ${error.message}`
                  );
                }
              }

              const cutoff = lastSuccessfulStart
                ? new Date(
                    new Date(lastSuccessfulStart).getTime() - SAFETY_OVERLAP_MS
                  ).toISOString()
                : null;

              const scanAll = forceFullScan || !targetLabelExists || !cutoff;

              const params = {
                owner,
                repo,
                state: "all",
                sort: "updated",
                direction: "asc",
                per_page: 100
              };

              if (!scanAll) {
                params.since = cutoff;
              }

              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                params
              );

              let candidates = 0;
              let skippedLabeled = 0;
              let skippedTooFewComments = 0;
              let scanned = 0;
              let labeled = 0;
              let failed = 0;

              core.info(
                scanAll
                  ? "Backfill mode: full scan."
                  : `Backfill mode: incremental since ${cutoff}.`
              );

              for (const issue of issues) {
                if (issue.pull_request) continue;
                candidates += 1;

                // Already approved or already labeled: do not scan comments.
                if (hasLabel(issue, label)) {
                  skippedLabeled += 1;
                  continue;
                }

                // Two distinct approvers require at least two comments.
                if (Number(issue.comments || 0) < REQUIRED_APPROVALS) {
                  skippedTooFewComments += 1;
                  continue;
                }

                scanned += 1;

                try {
                  const approvers = await getApprovers(issue.number);

                  if (await addLabelIfNeeded(issue, approvers)) {
                    labeled += 1;
                    core.info(
                      `#${issue.number}: added "${label}" ` +
                      `(${[...approvers].join(", ")}).`
                    );
                  }
                } catch (error) {
                  failed += 1;
                  core.warning(`#${issue.number}: ${error.message}`);
                }
              }

              core.info(
                `Backfill finished: ${candidates} candidate issue(s), ` +
                `${skippedLabeled} already labeled, ` +
                `${skippedTooFewComments} with fewer than ` +
                `${REQUIRED_APPROVALS} comments, ${scanned} scanned, ` +
                `${labeled} labeled, ${failed} failure(s).`
              );

              if (failed > 0) {
                core.setFailed(
                  `${failed} issue(s) failed. Re-run the backfill after fixing the errors.`
                );
              }

              return;
            }

            // issue_comment: check only the issue that received the comment.
            const issue = context.payload.issue;

            if (!issue) {
              core.setFailed("No issue found in event payload.");
              return;
            }

            if (hasLabel(issue, label)) {
              core.info(
                `#${issue.number}: "${label}" is already present; skipping.`
              );
              return;
            }

            if (Number(issue.comments || 0) < REQUIRED_APPROVALS) {
              core.info(
                `#${issue.number}: fewer than ${REQUIRED_APPROVALS} comments; skipping.`
              );
              return;
            }

            const approvers = await getApprovers(issue.number);

            core.info(
              `#${issue.number}: ${approvers.size} distinct approver(s) ` +
              `(${[...approvers].join(", ") || "none"}); ` +
              `need ${REQUIRED_APPROVALS}.`
            );

            if (await addLabelIfNeeded(issue, approvers)) {
              core.info(`#${issue.number}: added "${label}".`);
            } else if (approvers.size >= REQUIRED_APPROVALS) {
              core.info(`#${issue.number}: "${label}" is already present.`);
            }
